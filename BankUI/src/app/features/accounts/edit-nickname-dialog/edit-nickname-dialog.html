<h2 mat-dialog-title>Takma Adı Düzenle</h2>

<form [formGroup]="form">

  <mat-dialog-content>

    <mat-form-field appearance="outline">

      <mat-label>Takma Ad</mat-label>

      <input
        matInput
        formControlName="nickname">

    </mat-form-field>

  </mat-dialog-content>

  <mat-dialog-actions align="end">

    <button
      mat-button
      type="button"
      (click)="dialogRef.close()">

      İptal

    </button>

    <button
      mat-raised-button
      color="primary"
      type="button"
      (click)="save()">

      Kaydet

    </button>

  </mat-dialog-actions>

</form>
