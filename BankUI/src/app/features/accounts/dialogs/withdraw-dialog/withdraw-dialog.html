<h2 mat-dialog-title>Para Çek</h2>

<div mat-dialog-content>

  <p>
    <strong>Hesap:</strong>
    {{ account.nickname || account.currencyCode + ' Hesabı' }}
  </p>

  <p>
    <strong>Bakiye:</strong>
    {{ account.balance | currency: account.currencyCode : 'symbol' : '1.2-2' : 'tr' }}
  </p>

  <mat-form-field appearance="outline" class="full-width">

    <mat-label>Çekilecek Tutar</mat-label>

    <input
      matInput
      type="number"
      [(ngModel)]="amount"
      min="0.01">

  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">

    <mat-label>Açıklama</mat-label>

    <textarea
      matInput
      rows="3"
      [(ngModel)]="description">
    </textarea>

  </mat-form-field>

</div>

<div mat-dialog-actions align="end">

  <button
    mat-button
    type="button"
    (click)="close()">
    İptal
  </button>

  <button
    mat-raised-button
    color="primary"
    type="button"
    (click)="withdraw()">
    Para Çek
  </button>

</div>
