<div class="container">

    <h2>Para Çek</h2>
  
    <div class="form-group">
        <p>Hesap No: {{ accountId }}</p>
    </div>
  
    <div class="form-group">
      <label>Tutar</label>
      <input
        type="number"
        [(ngModel)]="amount">
    </div>
  
    <div class="form-group">
      <label>Açıklama</label>
      <input
        type="text"
        [(ngModel)]="description">
    </div>
  
    <button (click)="withdraw()">
      Para Çek
    </button>
  
    <p
      *ngIf="message"
      [style.color]="isSuccess ? 'green' : 'red'">
  
      {{ message }}
  
    </p>
  
  </div>
